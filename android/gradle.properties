org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Debe quedar en false: pdfx y flutter_compass aplican el plugin de Kotlin
# (KGP) por su cuenta, y AGP 9 rechaza eso si el Kotlin integrado está activo.
# AGP documenta esta combinación con newDsl=false como la vía de compatibilidad
# mientras los plugins migran.
android.builtInKotlin=false

# Necesario. Verificado quitándolo: el build vuelve a fallar en
# :image_picker_android:compileDebugKotlin y :pdfx:compileDebugKotlin con
# "Could not close incremental caches [...] is already registered".
# Es un problema independiente del de builtInKotlin, no un síntoma de aquel.
kotlin.incremental=false

workflows:
  # -----------------------------------------------------------------------
  # Compila sin firma y sin cuenta de Apple, y empaqueta el resultado como
  # un .ipa (no solo el .app suelto). Ese .ipa se puede instalar en un
  # iPhone real, sin pagar el Apple Developer Program, con Sideloadly
  # (sideloadly.io) desde Windows: pide solo un Apple ID gratuito y un cable
  # USB. La app queda instalada 7 días; Sideloadly la puede refirmar sola
  # si el PC sigue prendido y en la misma red.
  #
  # Sin disparador automático a propósito: se ejecuta a mano desde el
  # panel de Codemagic. El nivel gratuito da minutos de build limitados por
  # mes, y no conviene gastarlos en cada commit mientras se está probando.
  # -----------------------------------------------------------------------
  ios-verificacion:
    name: iOS - Verificación sin firma
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events: []
    scripts:
      - name: Obtener dependencias
        script: flutter pub get
      - name: Regenerar código de drift
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analizar
        script: flutter analyze
      - name: Tests
        script: flutter test
      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar como .ipa sin firmar
        script: |
          set -e
          mkdir -p build/ios/sideload/Payload build/ios/ipa
          cp -r build/ios/iphoneos/Runner.app build/ios/sideload/Payload/
          cd build/ios/sideload
          zip -r -q ../ipa/avenza-sin-firmar.ipa Payload
    artifacts:
      - build/ios/ipa/avenza-sin-firmar.ipa

  # -----------------------------------------------------------------------
  # Build firmado y publicación a TestFlight.
  #
  # Necesita, configurado en Codemagic (Settings del proyecto → Environment
  # variables / Code signing), un grupo de variables llamado
  # "appstore_credentials" con:
  #   - Una integración de App Store Connect (clave API: Issuer ID, Key ID,
  #     archivo .p8) creada en https://appstoreconnect.apple.com/access/api
  #   - El BUNDLE_ID de abajo dado de alta en App Store Connect
  #
  # Con eso, `xcode-project use-profiles` gestiona certificados y perfiles
  # de aprovisionamiento solo — no hace falta subir manualmente .p12 ni
  # .mobileprovision.
  #
  # Dispara solo con una etiqueta `ios-v*` (ej. `ios-v1.0.0`), no en cada
  # push: publicar a TestFlight sin querer en cada commit sería un error
  # caro de deshacer.
  # -----------------------------------------------------------------------
  ios-testflight:
    name: iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Nombre de la integración de App Store Connect, creada en Codemagic bajo
    # Team settings → Integrations → Developer Portal → App Store Connect. El
    # nombre que se le ponga ahí tiene que ser exactamente este.
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.avenzapobres.avenzaParaPobres"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.avenzapobres.avenzaParaPobres"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
    scripts:
      - name: Obtener dependencias
        script: flutter pub get
      - name: Regenerar código de drift
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Tests
        script: flutter test
      - name: Configurar firma de código
        script: xcode-project use-profiles
      - name: Compilar el .ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
